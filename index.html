<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dziennik XAU/USD</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0c0b08;--card:#15130d;--card2:#1c1910;--line:#2b2717;--gold:#d4af37;--gold2:#f3d97a;--gold3:#8a6d1d;--txt:#ece6d2;--mut:#8f876a;--g:#4fb283;--r:#e0564f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;padding-bottom:70px}
h1,h2,h3,.num{font-family:Georgia,"Palatino Linotype",serif;font-weight:500}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(12,11,8,.94);backdrop-filter:blur(8px);z-index:5;flex-wrap:wrap}
.logo{font-size:22px;background:linear-gradient(90deg,var(--gold3),var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:20px;cursor:pointer;font:inherit}
nav button.on{background:var(--card2);color:var(--gold2);box-shadow:inset 0 0 0 1px var(--gold3)}
main{max-width:1100px;margin:0 auto;padding:20px}
.btn{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--gold3));color:#1a1405;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold3)}
.btn.sm{padding:4px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:24px;color:var(--gold2)}
.kpi span{color:var(--mut);font-size:12.5px}
.pos{color:var(--g)}.neg{color:var(--r)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tr{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card);cursor:pointer}
.tr:hover{border-color:var(--gold3)}
.tr small{color:var(--mut)}
.badge{display:inline-block;padding:1px 9px;border-radius:12px;font-size:12.5px;border:1px solid var(--gold3);color:var(--gold2);margin:2px 4px 0 0}
.badge.TP{border-color:var(--g);color:var(--g)}.badge.SL{border-color:var(--r);color:var(--r)}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold3)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
label{display:block;color:var(--mut);font-size:13px;margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.chk{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.chk label{margin:0;color:var(--txt);font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;overflow:auto;z-index:20;padding:16px}
.modal.on{display:block}
.box{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--gold3);border-radius:16px;padding:20px}
.calc{color:var(--gold2);padding:10px 0}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.imgs div{position:relative}.imgs img{height:90px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.imgs i{position:absolute;top:2px;right:2px;background:#000c;border-radius:50%;width:20px;height:20px;text-align:center;cursor:pointer;font-style:normal;line-height:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{color:var(--mut);text-align:center;font-size:12.5px}
.day{min-height:68px;border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px;background:var(--card)}
.day b{font-weight:400;color:var(--mut)}.day .v{font-size:14px;margin-top:4px;font-weight:600}
.day.p{background:rgba(79,178,131,.14);border-color:rgba(79,178,131,.4)}.day.l{background:rgba(224,86,79,.13);border-color:rgba(224,86,79,.4)}.day.z{background:rgba(212,175,55,.1)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:18px}
.ch{height:230px;position:relative}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:6px;margin-bottom:10px}.ctl select{padding:5px 6px;font-size:13px}
.prow{display:grid;grid-template-columns:1.2fr 110px 1.6fr auto;gap:8px;margin-bottom:8px}
#lb{position:fixed;inset:0;background:#000e;display:none;z-index:30;align-items:center;justify-content:center}#lb.on{display:flex}#lb img{max-width:96%;max-height:94%}
.frow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin:4px 0}.flt{margin-bottom:10px}.day{cursor:pointer}.empty{color:var(--mut);text-align:center;padding:40px 10px}
@media(max-width:600px){.prow{grid-template-columns:1fr 1fr}.tr{grid-template-columns:70px 1fr}.tr>:last-child{grid-column:1/-1}.day{min-height:54px}main{padding:12px}}
</style>
<style id="glass">
:root{--g:#62f0b4;--r:#ff6b6b;--glass:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03));--gb:1px solid rgba(255,255,255,.13);--sh:0 10px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2)}
body{font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;background:radial-gradient(900px 600px at 12% -8%,rgba(212,175,55,.26),transparent 60%),radial-gradient(700px 520px at 105% 18%,rgba(255,216,107,.13),transparent 60%),radial-gradient(900px 650px at 45% 112%,rgba(138,109,29,.3),transparent 60%),#07060a;background-attachment:fixed;padding-bottom:100px}
header{background:rgba(14,12,8,.55);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border-bottom:1px solid rgba(255,255,255,.1)}
.logo{font-size:23px;text-shadow:0 0 22px rgba(243,217,122,.5)}
.card,.kpi,.tr,.day,.box{background:var(--glass);border:var(--gb);box-shadow:var(--sh);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-radius:22px}
.kpi{border-radius:18px}.tr{border-radius:18px;transition:transform .15s,border-color .15s}.tr:hover{transform:translateY(-2px);border-color:rgba(255,216,107,.5)}
.box{background:linear-gradient(145deg,rgba(40,33,16,.78),rgba(18,15,9,.8));border-color:rgba(255,216,107,.3)}
.modal{background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.kpi b{text-shadow:0 0 18px rgba(255,216,107,.5)}
.btn{box-shadow:0 0 24px rgba(212,175,55,.45),inset 0 1px 0 rgba(255,255,255,.5);border-radius:14px}.btn.ghost{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,216,107,.4)}
input,select,textarea{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px}
.chk{background:rgba(255,255,255,.05);border-radius:12px}
.badge{background:rgba(255,216,107,.08);border-color:rgba(255,216,107,.4)}
nav{display:flex;gap:4px;width:fit-content;max-width:calc(100% - 24px);margin:14px auto 0;padding:5px;border-radius:999px;background:rgba(255,255,255,.07);border:var(--gb);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--sh);overflow-x:auto}
nav button{border-radius:999px;padding:8px 15px;white-space:nowrap}
nav button.on{background:linear-gradient(135deg,rgba(255,216,107,.3),rgba(212,175,55,.15));color:#fff1b8;box-shadow:inset 0 0 0 1px rgba(255,216,107,.5),0 0 18px rgba(255,216,107,.25)}
.day.p{background:linear-gradient(145deg,rgba(98,240,180,.2),rgba(98,240,180,.04))}.day.l{background:linear-gradient(145deg,rgba(255,107,107,.2),rgba(255,107,107,.04))}
.hc{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px}
@media(max-width:700px){nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:auto;max-width:none;margin:0;z-index:15;justify-content:space-between;background:rgba(18,15,9,.6)}nav button{padding:9px 9px;font-size:12.5px;flex:1}}
</style>
<style>.sw{position:relative;margin-bottom:8px;border-radius:18px;overflow:hidden}.sw .tr{margin:0;position:relative;z-index:1;transition:transform .22s;touch-action:pan-y;background:linear-gradient(145deg,#231e11,#12100a)}.acts{position:absolute;right:0;top:0;bottom:0;width:160px;display:flex}.acts button{flex:1;border:0;font:inherit;font-weight:600;cursor:pointer}.acts .ed{background:linear-gradient(135deg,#f3d97a,#b8860b);color:#1a1405}.acts .dl{background:#d64545;color:#fff}</style><style>.cmb{margin-top:10px;padding:14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,216,107,.22);cursor:pointer}.mc{display:grid;grid-template-columns:repeat(7,27px);gap:3px;margin-top:4px}.mc div{height:27px;border-radius:7px;font-size:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);color:var(--mut)}.mc .on{background:rgba(255,216,107,.9);color:#1a1405;font-weight:700;cursor:pointer}.mc .off{background:rgba(255,107,107,.8);color:#fff;font-weight:700;cursor:pointer}</style></head>
<body>
<header>
  <div class="logo">XAU/USD · Dziennik</div>
  
  <div style="display:flex;gap:8px"><button class="btn ghost" onclick="exp()">💾 Kopia</button><button class="btn" onclick="openForm()">+ Nowy trade</button></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div id="lb" onclick="this.classList.remove('on')"><img id="lbi"></div>

<script>
const $=s=>document.querySelector(s);
const K='xau-journal-v1',DAYS=['Nd','Pn','Wt','Śr','Cz','Pt','So'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const uid=()=>Math.random().toString(36).slice(2,9);
const defParams=()=>[
 {id:'ob',name:'Typ OB',type:'select',opts:['Internal OB','External OB']},
 {id:'ctx',name:'Kontekst wejścia',type:'select',opts:['W trendzie','Korekta','Reversal']},
 {id:'sent',name:'Sentyment',type:'select',opts:['Bullish','Bearish','Neutralny']},
 {id:'trend',name:'Trend HTF',type:'select',opts:['Wzrostowy','Spadkowy','Boczny']},
 {id:'ses',name:'Sesja',type:'select',opts:['Azja','Londyn','Nowy Jork']},
 {id:'sweep',name:'Sweep płynności',type:'check',opts:[]},
 {id:'ltf',name:'Potwierdzenie LTF',type:'check',opts:[]}];
const defCharts=()=>[{dim:'dow',met:'wr',type:'bar'},{dim:'p_ob',met:'cnt',type:'doughnut'},{dim:'rr',met:'sum',type:'bar'},{dim:'p_ctx',met:'wr',type:'radar'}];
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.trades)return d}catch(e){}return{trades:[],params:defParams(),charts:defCharts()}})();
function defDayParams(){return[{id:'dsent',name:'Sentyment dnia',type:'select',opts:['Bullish','Bearish','Neutralny']},{id:'dtr',name:'Trend dnia',type:'select',opts:['Wzrostowy','Spadkowy','Boczny']},{id:'dvol',name:'Zmienność',type:'select',opts:['Niska','Średnia','Wysoka']},{id:'dmac',name:'Dzień z wydarzeniem makro',type:'check',opts:[]},{id:'dsci',name:'Trzymałem się planu',type:'check',opts:[]}]}
function norm(){S.meta=S.meta||{};S.meta.win=S.meta.win||{from:9,to:12};S.tiles=S.tiles||[];S.days=S.days||{};S.dayParams=S.dayParams||defDayParams();
 [...S.charts,...S.tiles].forEach(c=>{if(!c.filters){c.filters=c.filt?[{k:c.filt,v:c.filtv||''}]:[];delete c.filt;delete c.filtv}})}
norm();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Brak miejsca w pamięci przeglądarki. Usuń część zdjęć lub zrób eksport kopii.')}};

const NEON=['#ffd86b','#ffb703','#f3e5ab','#c9972b','#fff1b8','#8a6d1d','#e8a317','#ffe08a'];
const grad=(c0,c1)=>ctx=>{const a=ctx.chart.chartArea;if(!a)return c1;const g=ctx.chart.ctx.createLinearGradient(0,a.top,0,a.bottom);g.addColorStop(0,c0);g.addColorStop(1,c1);return g};
let chReady=false;function chInit(){if(chReady||typeof Chart==='undefined')return;chReady=true;Chart.defaults.color='#a79d7d';Chart.defaults.borderColor='rgba(255,255,255,.07)';
 Chart.register({id:'glow',beforeDatasetDraw(c){c.ctx.save();c.ctx.shadowColor='rgba(255,200,60,.85)';c.ctx.shadowBlur=16},afterDatasetDraw(c){c.ctx.restore()}})}
const hr=t=>t.time?+t.time.slice(0,2):null;
const inWinB=t=>{const h=hr(t),w=S.meta.win;return h!==null&&h>=w.from&&h<w.to};
/* ---------- obliczenia ---------- */
const rr=t=>{const r=Math.abs(t.entry-t.sl);return r?+(Math.abs(t.tp-t.entry)/r).toFixed(2):0};
const risk=t=>Math.abs(t.entry-t.sl);
const hasMan=t=>t.manual&&t.exit!==''&&t.exit!=null&&risk(t)>0;
const R=t=>{if(hasMan(t))return +(((t.dir==='Short'?t.entry-t.exit:t.exit-t.entry))/risk(t)).toFixed(2);return t.res==='TP'?rr(t):t.res==='SL'?-1:0};
const out=t=>hasMan(t)?(R(t)>0.05?'TP':R(t)<-0.05?'SL':'BE'):t.res;
const obw=t=>+t.obW||(t.obHi&&t.obLo?Math.abs(t.obHi-t.obLo):0);
const pbucket=p=>p===''||p==null?'brak':Math.min(75,Math.floor(p/25)*25)+'–'+(Math.min(75,Math.floor(p/25)*25)+25)+'%';
const bucket=w=>w?(Math.floor(w/2)*2)+'–'+(Math.floor(w/2)*2+2)+' $':'brak';
const D=s=>new Date(s+'T12:00');
const fmt=n=>(n>0?'+':'')+(+n.toFixed(2));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const numF=()=>{const n=[['rr','RR'],['obW','Szerokość OB $'],['obPct','% od krawędzi OB'],['entry','Entry'],['nearEntry','Brakowało do wejścia $'],['nearTP','Brakowało do TP $'],['nearSL','Brakowało do SL $'],['beyond','Poszła dalej za TP/SL $'],['pnl','Wynik $'],['dur','Czas w pozycji (min)'],['stress','Stres (1–5)']];S.params.filter(p=>p.type==='number').forEach(p=>n.push(['p_'+p.id,p.name]));S.dayParams.filter(p=>p.type==='number').forEach(p=>n.push(['d_'+p.id,p.name+' (dzień)']));return n};
const nv=(t,k)=>{const v=k==='rr'?rr(t):k==='obW'?obw(t):k.startsWith('d_')?((S.days[t.date]||{}).p||{})[k.slice(2)]:k.startsWith('p_')?(t.p||{})[k.slice(2)]:t[k];return v===''||v==null||isNaN(+v)||(k==='obW'&&!v)?null:+v};
function dims(){
 const d={dow:['Dzień tygodnia',t=>DAYS[D(t.date).getDay()]],date:['Data (dzień)',t=>t.date],man:['Zamknięcie ręczne',t=>t.manual?'Tak':'Nie'],stress:['Stres (1–5)',t=>t.stress?String(t.stress):'brak'],hour:['Godzina wejścia',t=>t.time?pad(hr(t))+':00–'+pad(hr(t)+1)+':00':'brak'],half:['Pół godziny',t=>t.time?t.time.slice(0,2)+':'+(+t.time.slice(3,5)<30?'00':'30'):'brak'],win:['Okno edge',t=>t.time?(inWinB(t)?'W oknie '+pad(S.meta.win.from)+'–'+pad(S.meta.win.to):'Poza oknem'):'brak'],dur:['Czas w pozycji',t=>{const v=nv(t,'dur');return v==null?'brak':v<5?'<5 min':v<15?'5–15 min':v<30?'15–30 min':v<60?'30–60 min':'60+ min'}],mon:['Miesiąc',t=>t.date.slice(0,7)],dir:['Kierunek',t=>t.dir],res:['Wynik',t=>out(t)],
  rr:['RR',t=>'1:'+(Math.round(rr(t)*2)/2)],obw:['Szerokość OB',t=>bucket(obw(t))],obp:['% od krawędzi OB',t=>pbucket(t.obPct)],ev:['Wydarzenie makro',t=>t.macro||'Brak']};
 [['nearEntry','Brakowało do wejścia'],['nearTP','Brakowało do TP'],['nearSL','Brakowało do SL'],['beyond','Poszła dalej za TP/SL']].forEach(([k,n])=>d['n_'+k]=[n,t=>bucket(nv(t,k))]);
 S.params.forEach(p=>{d['p_'+p.id]=[p.name,p.type==='number'?t=>bucket(nv(t,'p_'+p.id)):t=>{const v=t.p&&t.p[p.id];return p.type==='check'?(v?'Tak':'Nie'):(v||'—')}]});
 d.dev=['Wydarzenie dnia',t=>((S.days[t.date]||{}).ev)||'Brak'];
 S.dayParams.forEach(p=>{d['d_'+p.id]=[p.name+' (dzień)',p.type==='number'?t=>bucket(nv(t,'d_'+p.id)):t=>{const v=((S.days[t.date]||{}).p||{})[p.id];return p.type==='check'?(v?'Tak':'Nie'):(v||'—')}]});
 return d}
function METS(){const m={cnt:'Liczba tradów',wr:'Winrate %',sum:'Suma R',avg:'Średnie R'};
 numF().forEach(([k,n])=>{m['avg:'+k]='Średnia: '+n;m['sum:'+k]='Suma: '+n;m['max:'+k]='Maks: '+n});return m}
function metric(a,m){if(!a.length)return 0;
 if(m.includes(':')){const[op,k]=m.split(':',2),key=m.slice(op.length+1),v=a.map(t=>nv(t,key)).filter(x=>x!==null);if(!v.length)return 0;
  return +(op==='sum'?v.reduce((x,y)=>x+y,0):op==='max'?Math.max(...v):avg(v)).toFixed(2)}
 const w=a.filter(t=>out(t)==='TP').length,l=a.filter(t=>out(t)==='SL').length,s=a.reduce((x,t)=>x+R(t),0);
 return m==='cnt'?a.length:m==='wr'?(w+l?+(w/(w+l)*100).toFixed(1):0):m==='sum'?+s.toFixed(2):+(s/a.length).toFixed(2)}
const fil=(T,c)=>(c.filters||[]).reduce((T,f)=>{const d=f.k&&dims()[f.k];return d&&f.v?T.filter(t=>String(d[1](t))===f.v):T},T);
const valsOf=k=>{const d=dims()[k];return d?[...new Set(S.trades.map(d[1]))].sort((a,b)=>String(a).localeCompare(b,'pl',{numeric:true})).map(v=>[String(v),String(v)]):[]};
function agg(c){const d=dims(),f=(d[c.dim]||d.dow)[1],f2=c.dim2&&d[c.dim2]?d[c.dim2][1]:null,T=fil(S.trades,c);
 const ord=(k,key)=>key==='dow'?['Pn','Wt','Śr','Cz','Pt','So','Nd'].filter(x=>k.includes(x)):k.sort((a,b)=>String(a).localeCompare(b,'pl',{numeric:true}));
 const labels=ord([...new Set(T.map(f))],c.dim),ser=f2?ord([...new Set(T.map(f2))],c.dim2):[null];
 return{labels,shown:c.met==='wr'?labels.map(l=>l+' (n='+T.filter(t=>f(t)===l&&['TP','SL'].includes(out(t))).length+')'):labels,sets:ser.map(s=>({label:s===null?METS()[c.met]:s,data:labels.map(l=>metric(T.filter(t=>f(t)===l&&(s===null||f2(t)===s)),c.met))}))}}
const sel=(o,v,on,ph)=>`<select onchange="${on}">${ph?`<option value="">${ph}</option>`:''}${o.map(([k,n])=>`<option value="${esc(k)}" ${k===v?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
function ctl(ref,c,chart){const D=Object.entries(dims()).map(([k,v])=>[k,v[0]]),M=Object.entries(METS());c.filters=c.filters||[];
 const w=(l,h)=>`<div><label style="font-size:11px">${l}</label>${h}</div>`;
 const fl=c.filters.map((f,j)=>`<div class="frow">${sel(D,f.k,`${ref}.filters[${j}].k=this.value;${ref}.filters[${j}].v='';cs()`)}${sel(valsOf(f.k),f.v,`${ref}.filters[${j}].v=this.value;cs()`,'wszystkie')}<button class="btn ghost sm" onclick="${ref}.filters.splice(${j},1);cs()">×</button></div>`).join('');

 const off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();let c='',tr=0,tu=0,tn=0;
 ['Pn','Wt','Śr','Cz','Pt','So','Nd'].forEach(d=>c+=`<div class="h">${d}</div>`);
 for(let i=0;i<off;i++)c+='<div></div>';
 for(let d=1;d<=n;d++){const key=`${y}-${pad(m+1)}-${pad(d)}`,a=by[key];

 ${c.filters.map((f,j)=>`<div class="frow">${sel(D,f.k,`S.meta.cmb.filters[${j}].k=this.value;S.meta.cmb.filters[${j}].v='';save();rEdge()`)}${sel(valsOf(f.k),f.v,`S.meta.cmb.filters[${j}].v=this.value;save();rEdge()`,'wszystkie')}<button class="btn ghost sm" onclick="S.meta.cmb.filters.splice(${j},1);save();rEdge()">×</button></div>`).join('')}
 <button class="btn ghost sm" style="margin-top:6px" onclick="S.meta.cmb.filters.push({k:'dow',v:''});save();rEdge()">+ Filtr</button></details>`;
 return `<div class="card"><div class="row" style="margin-bottom:6px"><h3>🏆 Najlepsze kombinacje</h3></div>
 <p style="color:var(--mut);font-size:13px">Analiza ${fil(S.trades,c).length} tradów${c.filters.some(f=>f.v)?' (po filtrach)':''}. Skuteczność liczona z tradów TP i SL (liczba w opisie). Kliknij kombinację, aby zobaczyć jej dni w kalendarzu.</p>${bestTimes()}${set}
 ${COMBOS.length?COMBOS.map((o,i)=>`<div class="cmb" onclick="toggleCombo(${i})"><div style="margin-bottom:8px"><b class="num" style="color:var(--gold2)">#${i+1}</b> ${o.txt.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div>
 <div class="kpis" style="margin:0">${[['Tradów w kombinacji',o.n],['Skuteczność (z '+(o.w+o.l)+' TP/SL)',o.wr+'%'],['Suma R',fmt(o.r)],['Śr. R / trade',fmt(o.r/o.n)]].map(([n,v])=>`<div class="kpi"><b class="num" style="font-size:19px">${v}</b><span>${n}</span></div>`).join('')}</div>
 ${o.n<30?`<small style="color:var(--mut)">⚠ Próba ${o.n}/30, to wstępna obserwacja.</small>`:''}<div id="cm${i}" style="display:none;margin-top:10px"></div></div>`).join(''):'<p style="color:var(--mut)">Brak kombinacji spełniających kryteria. Dodaj więcej tradów, zmniejsz minimum albo zmień filtry i wybrane parametry.</p>'}</div>`}

/* ---------- parametry ---------- */
function rParams(){
 const row=(L,p,i)=>`<div class="prow"><input value="${esc(p.name)}" onchange="S.${L}[${i}].name=this.value;save()">
 <select onchange="S.${L}[${i}].type=this.value;S.${L}[${i}].opts=S.${L}[${i}].opts||[];save();rParams()">${[['select','Lista'],['check','Ptaszek'],['number','Liczba'],['text','Tekst']].map(([k,v])=>`<option value="${k}" ${p.type===k?'selected':''}>${v}</option>`).join('')}</select>
 ${p.type==='select'?`<input value="${esc((p.opts||[]).join(', '))}" placeholder="Wartości po przecinku" onchange="S.${L}[${i}].opts=this.value.split(',').map(s=>s.trim()).filter(Boolean);save()">`:'<div></div>'}
 <button class="btn ghost sm" onclick="if(confirm('Usunąć parametr?')){S.${L}.splice(${i},1);save();rParams()}">×</button></div>`;
 const sec=(L,t,d)=>`<div class="card" style="margin-bottom:14px"><div class="row"><h3>${t}</h3><button class="btn sm" onclick="S.${L}.push({id:uid(),name:'Nowy parametr',type:'select',opts:['Opcja 1','Opcja 2']});save();rParams()">+ Dodaj parametr</button></div><p style="color:var(--mut);margin-bottom:12px">${d}</p>${S[L].map((p,i)=>row(L,p,i)).join('')}</div>`;
 $('#main').innerHTML=sec('params','Parametry tradu','Pojawiają się w formularzu tradu. Możesz dodać dowolną liczbę.')+sec('dayParams','Parametry dnia','Zapisywane osobno dla każdego dnia (zakładka Dni). Można ich używać w wykresach, statystykach i filtrach.')+
 `<div class="card"><h3 style="margin-bottom:8px">Kopia zapasowa</h3><p style="color:var(--mut);margin-bottom:12px">Dane są w pamięci tej przeglądarki. Ostatnia kopia: ${S.meta.lastBackup?new Date(S.meta.lastBackup).toLocaleString('pl-PL'):'brak'}.</p>
 <button class="btn" onclick="exp()">Zapisz kopię zapasową (JSON)</button> <label class="btn ghost" style="display:inline-block;cursor:pointer;color:var(--gold)">Wczytaj kopię<input type="file" accept=".json" hidden onchange="imp(this)"></label></div>`}
function exp(){S.meta.lastBackup=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='dziennik-xauusd-'+today()+'.json';a.click();render()}
function imp(i){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.trades)throw 0;if(!confirm('Import zastąpi obecne dane (trady: '+S.trades.length+'). Kontynuować?'))return;S=d;norm();save();render()}catch(e){alert('Niepoprawny plik.')}};r.readAsText(i.files[0])}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
render();
</script>
</body>
</html>
